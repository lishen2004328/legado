apply from: 'download.gradle'
apply from: 'cronet-loader.gradle'

static def releaseTime() {
    return new Date().format("yyMMddHH", TimeZone.getTimeZone("GMT+8"))
}

def name = "legado"
def version = "3." + releaseTime()
def versionCodeValue = 30000
// Preserve the published code at this point, then ignore GitHub wrapper merge commits.
def versionCodeBaseCommit = '9639f027fbc8cfdf57ce136e9c0e98829a235aef'
def versionCodeAtBase = 37540
try {
    def gitCount = providers.exec {
        commandLine 'git', 'rev-list', "${versionCodeBaseCommit}..HEAD", '--count', '--no-merges'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (gitCount) {
        versionCodeValue = versionCodeAtBase + Integer.parseInt(gitCount)
    }
} catch (ignored) {
    // Keep source archives buildable when Git is unavailable.
}
def armOnly = project.findProperty("armOnly")?.toBoolean() ?: false
def smartWebDebugMinSdk = project.findProperty("smartWebDebugMinSdk")?.toInteger() ?: 23

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    signingConfigs {
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            myConfig {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId "com.legado.app"
        minSdk smartWebDebugMinSdk
        targetSdk 36
        versionCode = versionCodeValue
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Keep app translations while dropping unused transitive dependency locales.
        resourceConfigurations += [
                'en',
                'es-rES',
                'ja-rJP',
                'pt-rBR',
                'vi',
                'zh',
                'zh-rCN',
                'zh-rHK',
                'zh-rTW'
        ]
        project.ext.set("archivesBaseName", name + "_" + version)

        if (armOnly) {
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    buildTypes {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig = signingConfigs.myConfig
            }
            applicationIdSuffix '.release'
            if (getApplicationIdSuffix() == '.releaseA') {
                manifestPlaceholders.put("app_name", "@string/app_name_a")
            } else {
                manifestPlaceholders.put("app_name", "@string/app_name")
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig = signingConfigs.myConfig
            }
            manifestPlaceholders.put("app_name", "@string/app_name")

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources.excludes.add('META-INF/*')
        resources.excludes.addAll([
                'tables/Transcoder_*.bin',
                '*.proto',
                '**/*.proto',
                'src/**',
                'kotlin/*.kotlin_builtins',
                'kotlin/**/*.kotlin_builtins'
        ])
        jniLibs {
            keepDebugSymbols += [
                    '**/libandroidx.graphics.path.so',
                    '**/libarchive-jni.so',
                    '**/libdatastore_shared_counter.so',
                    '**/libimage_processing_util_jni.so',
                    '**/librenderscript-toolkit.so',
                    '**/librtmp-jni.so',
                    '**/libsurface_util_jni.so'
            ]
        }
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
        }
    }
    lint {
        disable 'MissingTranslation'
    }
}

