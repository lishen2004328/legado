name: Smart Web Import APK

on:
  push:
    branches:
      - feature/smart-web-import

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon -PsmartWebDebugMinSdk=26
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-smart-web-debug
          path: app/build/outputs/apk/**/*.apk
